[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-consistency-graph"
version = "0.1.0"
description = "Adaptive Consistency Graph for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
tokenizer = ["transformers>=4.45,<5"]
browse = ["mcp>=1.12,<2", "openai>=1.60,<3"]
planning = ["openai>=1.60,<3", "pandas>=2.2,<3", "rank-bm25>=0.2.2,<0.3"]
swe = ["pandas>=2.2,<3", "pyarrow>=17"]

[project.scripts]
acg = "acg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
